# local postgres for development
# start:  docker compose up -d
# stop:   docker compose down
# reset:  docker compose down -v   (deletes the data, sql files run again on next start)

services:
  db:
    image: postgres:17
    container_name: gym-app-db
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gym_app
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro,z   # ,z is needed on fedora (selinux), doesn't hurt elsewhere
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
